plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.family'
version = '1.0.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.0'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }
tasks.named('bootWar') { archiveFileName = 'asset-manager.war' }
tasks.named('war') { enabled = false }

tasks.register('migrateDailyPrice', JavaExec) {
    description = 'Add daily stock price fields; historical snapshots preserve the collected quotes.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'tools/ApplyDailyPriceMigration.java'
    workingDir = projectDir
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.register('migrateAccountCardPayment', JavaExec) {
    description = 'Add account-level card payment history links without changing balances.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'tools/ApplyAccountCardMigration.java'
    workingDir = projectDir
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.register('migrateKbCardImport', JavaExec) {
    description = 'Create the KB card import identity table in the configured local database.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'tools/ApplyKbMigration.java'
    workingDir = projectDir
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
